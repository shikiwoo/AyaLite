# Needs .env and config.toml next to this file (see README), then:
#   docker compose up -d
# NOTE: entries in .env must have no spaces around "=" (DISCORD_BOT_TOKEN=...).
# For local tweaks, put them in compose.override.yaml (gitignored) - Compose
# merges it on top of this file automatically.
services:
  ayalite:
    image: ghcr.io/shikiwoo/ayalite:latest
    # Used by `docker compose build` / `docker compose up --build` to build
    # locally instead of pulling the published image
    build: .
    pull_policy: missing
    container_name: ayalite
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./config.toml:/app/config.toml:ro
      - ayalite-state:/state

volumes:
  ayalite-state:
